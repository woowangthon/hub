name: Archive Automatic Deployment

on:
  push:
    branches: ['W*']
  schedule:
    - cron: '10 15 * * *' # Daily at 00:10 Asia/Seoul
  workflow_call:
    inputs:
      full_rebuild:
        type: boolean
        default: false

permissions:
  contents: read

# The manual caller must not also acquire this lock.
concurrency:
  group: ${{ github.event_name == 'push' && format('archive-check-{0}', github.ref) || 'archive-pages' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  validate:
    name: Validate Archive Submission
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: archive-page
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: pnpm install --frozen-lockfile
      - name: Validate Submitted Commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUBMISSION_BRANCH: ${{ github.ref_name }}
          SUBMISSION_SHA: ${{ github.sha }}
        run: node scripts/archive.mjs validate --branch "$SUBMISSION_BRANCH" --sha "$SUBMISSION_SHA"

  build:
    name: Collect and Build Archive
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      needs_build: ${{ steps.plan.outputs.needs_build }}
      code_sha: ${{ steps.plan.outputs.code_sha }}
      build_attempt: ${{ steps.plan.outputs.build_attempt }}
      pages_artifact: ${{ steps.plan.outputs.pages_artifact }}
      candidate_artifact: ${{ steps.plan.outputs.candidate_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: archive-page
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: pnpm install --frozen-lockfile
      - name: Plan Archive Build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FULL_REBUILD: ${{ inputs.full_rebuild || false }}
        run: |
          if [ "$FULL_REBUILD" = "true" ]; then
            node scripts/archive.mjs plan --full
          else
            node scripts/archive.mjs plan
          fi
      - name: Restore Archive Cache
        if: steps.plan.outputs.needs_build == 'true' && !inputs.full_rebuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .archive/cache
          key: archive-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: archive-data-v1-
      - name: Collect and Validate Archive
        if: steps.plan.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/archive.mjs collect
      - name: Run Regression Tests
        if: steps.plan.outputs.needs_build == 'true'
        run: pnpm test
      - name: Build Archive Site
        if: steps.plan.outputs.needs_build == 'true'
        run: pnpm build:archive
      - name: Save Archive Cache
        if: steps.plan.outputs.needs_build == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .archive/cache
          key: archive-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Archive Candidate
        if: steps.plan.outputs.needs_build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.plan.outputs.candidate_artifact }}
          path: .archive/generated/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload Archive Site
        if: steps.plan.outputs.needs_build == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          name: ${{ steps.plan.outputs.pages_artifact }}

  deploy:
    name: Publish Archive (build ${{ github.run_id }}:${{ needs.build.outputs.build_attempt }})
    needs: build
    if: needs.build.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Out Verified Archive Build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.code_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Download Archive Candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.build.outputs.candidate_artifact }}
          path: state
      - name: Verify Archive Publication Baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/archive/guard.mjs
      - name: Deploy Archive Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}
      - name: Save Archive Publication State
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: archive-published-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: state/manifest.json
          if-no-files-found: error
          retention-days: 90
